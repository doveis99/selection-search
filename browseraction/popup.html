<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
.container{
    width: 300px;
    padding: 0.3em;
}
.search-input {
    padding: 0.5em;
    width: 100%;
    -webkit-appearance: textfield;
}
.search-engines{
    display: flex;
    flex-wrap: wrap;
    list-style-type: none;
    padding: 0;
    margin: 0.8em 0 0 0;
}
.search-engines.with-suggestions{
    margin-top: 0;
}

.search-engines li{
    flex: 0 50%;
    width: 50%;
}
.search-engines a{
    padding: 0.5em;
    display: flex;
    text-decoration: none;
    color: #115f93;
    border-radius: 2px;
    align-items: center;
}

.search-engines a:focus {
    background: none;
    outline: 1px solid #789bb9;
    box-shadow: 0 0 2px #333;
}

.search-engines a:hover{
    background: #ddd;
}
.search-engines .node.is-hidden {
    display: none;
}
.search-engines img {
    vertical-align: middle;
    flex: 0 auto;
    width: 16px;
    height: 16px;
}
.search-engines .engine-name{
    padding-left: 0.5em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.search-engines .separator{
    display: none;
}

.search-engines.icons-only .engine-name{
    display: none;
}

.search-engines.icons-only li{
    flex: 0 10%;
    width: 12%;
    text-align: center;
}
.search-engines.icons-only a{
    padding: 0.5em;
    display: inline-block;
}

.input-wrapper{
    position:relative;
}

.suggestions{
    /* position: absolute; */
    padding: 0.4em;
    margin: 0;
    background: #ffffff;
    list-style-type: none;
    box-sizing: border-box;
    width: 100%;
    display: none;
}
.suggestions li.active{
    background: #eee;
    font-weight: bold;
}
.suggestions a {
    display: inline-block;
    padding: 0.4em;
    display: block;
    text-decoration: none;
    color: #333;
}

.capture-row{
    margin-top: 0.4em;
    padding-top: 0.3em;
    border-top: 1px solid #ddd;
}
.capture-row.is-hidden{
    display: none;
}
.capture-button{
    display: flex;
    align-items: center;
    width: 100%;
    padding: 0.5em;
    border: 0;
    border-radius: 2px;
    background: none;
    color: #115f93;
    font: inherit;
    text-align: left;
    cursor: pointer;
}
.capture-button:hover{
    background: #ddd;
}
.capture-button:focus{
    background: none;
    outline: 1px solid #789bb9;
    box-shadow: 0 0 2px #333;
}
.capture-button svg{
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    margin-right: 0.5em;
}

</style>
</head>
<body>
<div class="container">

<div class="input-wrapper">
<input class="search-input" name="q" type="search" data-i18n-placeholder="toolbar_search_placeholder" autocomplete="off" autofocus>
<ul class="suggestions">
</ul>
<template id="suggestion-template">
  <li><a href="#"><img src="#" class="engine-img"></a></li>
</template>
</div>

<ul class="popup search-engines"></ul>
<template id="search-engine-template">
  <li class="node">
    <a href="#" class="engine-link">
        <img src="#" class="engine-img">
        <span class="engine-name"></span>
    </a>
    </a>
  </li>
</template>

<div class="capture-row is-hidden">
  <button type="button" class="capture-button">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5V2h3M11 2h3v3M14 11v3h-3M5 14H2v-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span data-i18n="toolbar_capture"></span>
  </button>
</div>

<script src="/common/browsersupport.js"></script>
<script src="/common/i18n.js"></script>
<script src="/common/encoding.js"></script>
<script src="/common/actionutils.js"></script>
<script src="/common/urlparse.js"></script>
<script src="/popup/event_utils.js"></script>
<script src="/popup/search_engine_hotkeys.js"></script>
<script src="actionutils.js"></script>
<script src="suggestions.js"></script>
<script src="popup.js"></script>
</div>

</body>
</html>
